# Dependabot configuration — referenced by SECURITY.md §"Dependency Management".
# Weekly grouped PRs for backend (pip) and frontend (npm); ecosystem-internal
# major bumps still open standalone PRs so a breaking change is easy to revert.
#
# Every `ignore` below mirrors an entry in docs/dependency-holds.md. Without the
# ignore, a held package is re-proposed weekly and — for anything in a group —
# takes the whole group's PR red with it, so the other bumps in that group cannot
# land either. Releasing a hold means deleting both the doc entry and its rule.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 1.1x removed AsyncQdrantClient.search, which two retrieval call sites
      # still use. Held until they move to query_points.
      - dependency-name: "qdrant-client"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: "npm"
    # The pnpm workspace manifest and its only lockfile live at the repository root.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held outright — no known good release, so a version-scoped ignore would
      # just re-propose the next broken one. Re-check manually per the doc.
      - dependency-name: "msw"
      - dependency-name: "jsdom"
      # Held to the runtime's major. Node 24 is what ci.yml and the build image
      # run; types ahead of the runtime describe APIs that are not there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint refuses to load against TS 7 at all, which takes every
      # ESLint-backed gate with it. Held until upstream supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @vee-validate/zod has no zod 4 release; its peer range stops at ^3.24.0
      # and it calls zod 3 internals, so zod 4 throws in every form at mount.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    ignore:
      # The build image must stay on the Node line ci.yml pins in NODE_VERSION,
      # otherwise the shipped bundle is built by a Node version CI never runs.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/backend/services/egress_proxy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/backend/services/mcp_supervisor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/deploy/sandbox/code-exec"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "docker"
    directory: "/deploy/sandbox/mcp-runtime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
