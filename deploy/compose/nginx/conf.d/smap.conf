# Upstreams are addressed through variables, not `upstream {}` blocks, so that
# nginx re-resolves the container names against Docker DNS on every request
# instead of caching the IPs from startup. An `upstream {}` block resolves once,
# so any `compose up -d` that recreated frontend or backend-web left this edge
# proxying to a dead container IP until nginx itself was restarted -- and
# restarting the edge is what lets a caching front proxy capture the 502s served
# during that window (see deploy/README.md Troubleshooting). Per-request
# resolution is what makes `up -d --no-deps <service>` a safe deploy. The cost
# is upstream keepalive: only `upstream {}` can pool connections.
#
# Every proxy_pass below therefore appends $request_uri explicitly: with a
# variable in the target, "no URI part" behaviour is easy to get subtly wrong,
# and none of these locations rewrite the URI, so the raw client URI is exact.
#
# The resolver lives HERE, not in nginx.conf, and that placement is load-bearing.
# conf.d is bind-mounted as a directory but nginx.conf is bind-mounted as a
# single file, so it is pinned to one inode: `git pull` replaces that file and
# the container keeps serving the pre-pull copy. Splitting these two directives
# across the two mounts once produced a config that passed `nginx -t` and then
# 502'd every request with "no resolver defined" -- new proxy_pass, stale
# resolver. `include conf.d/*.conf` runs inside http{}, so this is http context,
# exactly as it would be in nginx.conf.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Browser file delivery (/api/files/{ticket}, [R19a.14]). Defined here rather
# than in nginx.conf for the same single-file-mount reason as the resolver.
# The backend limits each ticket; this zone is only an edge backstop, sized so
# a class behind one NAT loading an image-heavy room is not throttled.
limit_req_zone $binary_remote_addr zone=files:10m rate=100r/s;
# The ticket in the path is a bearer credential: never write it to the log.
# This is the only access log format, set at http level so every server block
# inherits it; $smap_req_id comes from the http{} map in nginx.conf. Its name
# matches the format nginx.conf used to define, so a stale nginx.conf mount
# fails `nginx -t` on the duplicate instead of logging tickets.
map $request_uri $smap_logged_uri {
    ~^/api/files/  "/api/files/<ticket>";
    default        $request_uri;
}
log_format  json escape=json
  '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
  '"uri":"$smap_logged_uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"xri":"$smap_req_id"}';
access_log  /var/log/nginx/access.log  json;
# --- HTTP :80 — redirect everything to HTTPS, except local healthchecks ----
server {
    listen 80 default_server;
    server_name _;

    set $smap_backend backend-web:8000;

    # Container healthcheck hits http://127.0.0.1/healthz — keep plaintext so
    # the Docker healthcheck doesn't need to trust the dev self-signed cert.
    location = /healthz {
        proxy_pass http://$smap_backend/healthz;
        proxy_set_header X-Request-Id $smap_req_id;
    }

    location = /readyz {
        proxy_pass http://$smap_backend/readyz;
        proxy_set_header X-Request-Id $smap_req_id;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# --- HTTPS :443 — primary terminator (R19a.01–R19a.04). --------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # TLS 1.2 floor, 1.3 preferred; AEAD-only cipher suites. TLS 1.3 suite
    # names are fixed by the protocol and enabled via ssl_protocols; the
    # ssl_ciphers line governs TLS 1.2.
    ssl_certificate     /etc/nginx/certs/smap.crt;
    ssl_certificate_key /etc/nginx/certs/smap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:smap_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # R19a.04 — HSTS on every TLS response. `preload` is safe once the real
    # cert is wired; dev self-signed will cause browser warnings anyway.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # This nginx sits behind a TLS-terminating reverse proxy (NPM). Keep any
    # nginx-generated redirect (e.g. the trailing-slash 301) path-relative so it
    # is resolved against the browser's https origin and can never downgrade to
    # http:// — an http redirect target violates the page CSP (connect-src 'self').
    absolute_redirect off;

    set $smap_backend  backend-web:8000;
    set $smap_frontend frontend:5173;

    # Healthz/readyz over TLS for external probes.
    location = /healthz {
        proxy_pass http://$smap_backend/healthz;
        proxy_set_header X-Request-Id $smap_req_id;
    }

    location = /readyz {
        proxy_pass http://$smap_backend/readyz;
        proxy_set_header X-Request-Id $smap_req_id;
    }

    # /metrics — compose-network + localhost only (B.10).
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://$smap_backend/metrics;
        proxy_set_header X-Request-Id $smap_req_id;
    }

    # Auth endpoints — tighter rate limit (login brute-force, registration abuse).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$smap_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $smap_req_id;
        proxy_set_header Connection        "";
    }

    # TUS upload endpoint — unlimited body size for resumable uploads.
    # No trailing slash on the location: with a trailing slash + proxy_pass,
    # nginx auto-301s the slash-less creation POST (/api/tus) to /api/tus/,
    # and that redirect is blocked by the page CSP. A prefix without the slash
    # matches both /api/tus (create) and /api/tus/{id} (HEAD/PATCH/DELETE).
    location /api/tus {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://$smap_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $smap_req_id;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 0;
    }

    # API (REST + OpenAPI). Headers come from backend.
    # proxy_buffering off so SSE / streaming agent-token responses are not
    # held in nginx buffers before reaching the client (B2-1).
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://$smap_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $smap_req_id;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        client_max_body_size 10m;
    }

    # Browser file delivery. Ahead of /api/ (longest prefix wins) so it gets
    # its own rate zone; streamed, never spooled to disk.
    location /api/files/ {
        # The error log cannot be redacted, and its limit_req and upstream
        # entries quote the request line, ticket included. The redacted access
        # log still records every refused or failed request by status.
        error_log /var/log/nginx/error.log crit;
        limit_req zone=files burst=600 nodelay;
        proxy_pass http://$smap_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $smap_req_id;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
    }

    # WebSockets (§22.14).
    location /ws/ {
        proxy_pass http://$smap_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $smap_req_id;
        proxy_read_timeout 3600s;
    }

    # Frontend (dev: vite; prod overlay replaces with static root). Apply the
    # §19a.2 response headers here so the HTML shell is hardened even if the
    # backend layer is bypassed.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        proxy_pass http://$smap_frontend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;   # vite HMR over WS
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-Id $smap_req_id;
    }
}
