# Local-dev overrides: source-mount + reload, non-prod log level.
services:
  backend-web:
    container_name: smap_backend_web
    # Build the dev stage so pytest/mypy/ruff are available for in-container
    # test runs; the base compose.yml builds the slim `runtime` stage.
    # Only `target` is overridden — `context` and `dockerfile` must stay
    # inherited. The Dockerfile COPYs `backend/...` and `docs/...`, so it only
    # builds from the repo root; naming a context here silently re-breaks it.
    build:
      target: dev
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      SMAP_APP_ENV: dev
      SMAP_LOG_LEVEL: info
    volumes:
      - ../../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "28000:8000"

  backend-worker:
    container_name: smap_backend_worker
    # See backend-web: inherit context/dockerfile, override only the target.
    build:
      target: dev
    environment:
      SMAP_APP_ENV: dev
    volumes:
      - ../../backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

  knowledge-scan-worker:
    container_name: smap_knowledge_scan_worker
    build:
      target: dev
    environment:
      SMAP_APP_ENV: dev
    volumes:
      - ../../backend:/app

  knowledge-ingest-worker:
    container_name: smap_knowledge_ingest_worker
    build:
      target: dev
    environment:
      SMAP_APP_ENV: dev
    volumes:
      - ../../backend:/app

  minio:
    ports:
      - "29000:9000"
      - "29001:9001"

  postgres:
    ports:
      - "25432:5432"

  redis:
    ports:
      - "26379:6379"

  vault:
    ports:
      - "28200:8200"

  qdrant:
    ports:
      - "26333:6333"

  frontend:
    volumes:
      - ../../:/app
      # Keep the host's node_modules out of the container. pnpm's layout is a
      # tree of symlinks into a store, and one installed from a Windows host is
      # not usable under Linux -- the container found no vite binary and exited.
      # These anonymous volumes let the in-container `pnpm install` own them.
      - /app/node_modules
      - /app/frontend/node_modules

  neo4j:
    ports:
      - "27474:7474"
      - "27687:7687"
