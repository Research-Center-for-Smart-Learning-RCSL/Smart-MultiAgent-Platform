[project]
name = "smap-backend"
version = "0.0.0"
description = "SMAP backend — FastAPI + DDD bounded contexts."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }

# Runtime pins per docs/implement/A-foundations.md §A.2.
dependencies = [
  "fastapi>=0.137,<0.142",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.32,<0.53",
  "pydantic[email]>=2.9,<2.14",
  "pydantic-settings>=2.6,<2.16",
  "sqlalchemy[asyncio]==2.0.*",
  "asyncpg>=0.30,<0.32",
  "alembic>=1.13,<1.20",
  "arq>=0.26,<0.29",
  "croniter==6.2.*",  # cron evaluation: workflow cron scheduler + trigger lint
  "loguru==0.7.*",
  "aiosmtplib==5.1.*",  # SEC-DEP: <5.1.1 allows CRLF SMTP command injection (PYSEC-2026-2338)
  "argon2-cffi==23.1.*",
  "httpx>=0.27,<0.29",
  "bleach==6.4.*",
  "markdown-it-py>=3.0,<4.3",
  "google-re2==1.1.*",
  "jsonschema>=4.23,<4.27",  # workflow.schema.json validation (contexts/workflow); previously only resolved transitively via the dev-only pip-audit chain, so the runtime image lacked it

  "hvac>=2.3,<2.5",
  "redis>=5.2,<8.2",
  "pyjwt[crypto]==2.13.*",  # verify Google's RS256 OIDC id_token against JWKS (R6.14); algorithms pinned to RS256 at the call site. SEC-DEP: <2.13 has 6 known CVEs (crit-header bypass, HMAC/JWK confusion, JWKClient SSRF/DoS, algorithm allow-list bypass)

  "python-multipart==0.0.32",  # SEC-DEP: 0.0.27+ fixes multipart DoS; 0.0.30+ fixes CVE-2026-53538/39/40
  "orjson==3.12.*",
  "cryptography==50.0.*",  # SEC-DEP: 50.0 fixes the PKCS#7 Bleichenbacher oracle (PYSEC-2026-3552)
  "psycopg[binary]>=3.2,<3.4",
  "minio==7.2.*",
  "weasyprint==69.*",  # chat export → PDF (HTML render); needs pango/cairo + fonts-noto-cjk in the image. SEC-DEP: <68 leaks the url_fetcher SSRF guard across redirects (PYSEC-2026-2034)
  "pypdf==6.*",  # PDF text extraction for RAG / Knowledge Map ingestion (shared_kernel/text_extraction/parsers.py). Accepted upload type; without it PDF ingest 500s with "pypdf not installed"
  "python-docx==1.*",  # DOCX text extraction on the same ingestion path; accepted upload type (imported as `docx`)
  "neo4j>=5.24,<6.3",
  "qdrant-client==1.12.*",
  "protobuf>=5.29.6,<8.0.0",  # SEC-DEP: reject vulnerable protobuf releases (CVE-2026-0994)
  "prometheus-client>=0.21,<0.27",
  # >=0.16 for click 8.2+ support. 0.12.x mis-converts option defaults against
  # modern click: a bool flag arrives as the string "False" when absent and None
  # when passed, silently inverting every flag, and --help crashes outright.
  # click is transitive and unpinned here, so this broke on a click release with
  # no change on our side -- pin the consumer, not the dependency, since typer
  # 0.15.x "fixes" it by holding click below 8.2 for everything that shares it.
  "typer>=0.19,<0.28",
  "docker>=7.1,<7.3",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk==1.44.*",
  "opentelemetry-exporter-otlp-proto-http==1.44.*",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-instrumentation-sqlalchemy==0.65b0",
  "opentelemetry-instrumentation-httpx==0.65b0",
]
dev = [
  "ruff>=0.7,<0.17",
  "mypy>=1.13,<2.4",
  "import-linter>=2.1,<2.14",
  "pytest>=9.0,<9.2",  # SEC-DEP: <9.0.3 uses a predictable /tmp/pytest-of-{user} path (PYSEC-2026-1845)
  "pytest-asyncio==1.4.*",  # 1.x is the first series that accepts pytest 9
  "pytest-cov>=7.0,<7.2",
  "respx>=0.21,<0.24",
  "pip-audit>=2.7,<2.11",  # SEC-DEP: powers the CI dependency-audit gate
  # Exact pins, not `==X.Y.*`: typeshed ships date-stamped releases that add and
  # drop symbols within a patch series (types-bleach 6.4.0.20260607 removed
  # `html5lib_shim.Filter`), so a wildcard lets CI typecheck against stubs no
  # developer has locally. Bump deliberately, with the mypy run in the same PR.
  "types-bleach==6.4.0.20260728",
  "types-redis==4.6.0.20241004",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "contexts*", "shared_kernel*", "smap*"]

# `packages.find` collects .py files only. The worked-example courses and agent
# packs are JSON data, so without this a non-editable install ships an empty
# catalogue -- it works from a source checkout and fails from a wheel. Pinned by
# tests/unit/test_smap_examples_packaging.py.
[tool.setuptools.package-data]
"contexts.activities.infrastructure.examples" = ["courses/*.json"]
"contexts.agents.infrastructure.examples" = ["packs/*.json"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",              # isort
  "B",              # bugbear
  "UP",             # pyupgrade
  "N",              # pep8-naming
  "S",              # flake8-bandit
  "A",              # flake8-builtins
  "C4",             # flake8-comprehensions
  "PT",             # pytest style
  "RET",            # flake8-return
  "SIM",            # flake8-simplify
  "TID",            # flake8-tidy-imports
  "PL",             # pylint subset
  "RUF",
]
ignore = [
  "S101",    # allow assert in tests
  "PLR0913", # many-argument functions are fine for FastAPI deps
  # ── Stylistic-only / high-noise rules ─────────────────────────────────────
  # FastAPI's idiomatic pattern is `x: T = Depends(...)`; the Annotated-form
  # alternative is exercised where it adds value but we don't enforce it.
  "B008",
  # Exception class naming: project uses domain nouns (e.g. `LastAdminError`,
  # `A2ADeliveryFailed`); a blanket *Error suffix rename is API-breaking.
  "N818",
  # Magic numbers: many comparisons are HTTP status codes / retry counts /
  # bit widths where a named constant adds noise, not clarity.
  "PLR2004",
  # `×` (U+00D7) used intentionally in docs (e.g. "3 × replicas").
  "RUF001", "RUF002", "RUF003",
  # FastAPI dispatch middleware and a handful of large coordinator methods
  # are wide by nature; cyclomatic-complexity caps don't add safety here.
  "PLR0911", "PLR0912", "PLR0915",
  # A small set of well-scoped module globals (e.g. caches behind locks) are
  # intentional. Audited per-file rather than enforced project-wide.
  "PLW0603",
  # `import X as X` is the canonical PEP 484 explicit re-export pattern that
  # makes type checkers treat the symbol as part of the module's public API.
  "PLC0414",
  # Function-level imports are a deliberate pattern here, not an oversight:
  # the route registry (app/api/v1/__init__.py) and the plugin/bootstrap
  # wiring import inside functions to break import cycles between the API
  # layer and the contexts, and to keep module import time off the critical
  # path. Enforcing top-level imports would reintroduce those cycles.
  "PLC0415",
  # Same rationale as PLR0913 above, counted a different way: FastAPI handlers
  # take their dependencies positionally-or-by-keyword, so the positional cap
  # fires on the same signatures the argument cap already exempts.
  "PLR0917",
  # PEP 695 type parameters would re-declare, per function, TypeVars that are
  # shared with the Protocol classes describing the same constructors, and the
  # explicit `_co` variance is load-bearing there.
  "UP047",
  # `class X(str, Enum)` -> `StrEnum` is not a refactor, it changes behaviour:
  # `str(X.A)` and f-strings go from "X.A" to the member value. The 58 classes
  # this fires on are domain enums bound to PostgreSQL ENUM columns and used in
  # log lines and error messages, so the swap needs its own change with tests
  # rather than a lint autofix. See docs/dependency-holds.md.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Tests: bandit (assert, hardcoded test secrets), pylint refactor caps,
# pytest.raises-must-have-match / fixture-naming style rules, and PascalCase
# mock parameter naming (N803/N806/PT019) are all noise in test files.
"tests/**/*" = ["S", "PLR", "PT011", "PT004", "PT019", "N803", "N806", "E501"]
"**/__init__.py" = ["F401"]
# flake8-pytest-style keys off the `test_` prefix, and nothing under app/ is a
# test. The one match today is the POST .../tools/{tool_id}/test route handler,
# whose FastAPI `Depends(...)` defaults read as pytest parameter defaults.
"app/**" = ["PT"]

[tool.ruff.lint.isort]
known-first-party = ["app", "contexts", "shared_kernel", "smap"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
# The app only ever runs in Linux containers, and typeshed gates POSIX-only
# symbols (os.setsid, os.killpg, resource) on sys.platform. Without this pin a
# Windows workstation and CI disagree about which ignores are needed, so
# `warn_unused_ignores` in the strict zones fails whichever side didn't author
# the file.
platform = "linux"
strict = false           # default relaxed; strict on selected packages below
plugins = ["pydantic.mypy"]
show_error_codes = true
# Strict zones (shared_kernel, *.domain) re-enable warn_unused_ignores via
# strict=true; keep it off elsewhere so adding/removing a noqa doesn't ripple
# through the codebase as a CI failure.
warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = false
# Alembic migration scripts are dialect-heavy and audit-only; checking them
# adds no signal and produces JSONB-untyped-call noise. They're run manually,
# not imported by the app.
exclude = ["alembic/versions/"]

# Strict zones — domain purity enforced per REQUIREMENTS.md §23.
# `disallow_any_explicit` is intentionally NOT enabled: shared_kernel
# legitimately accepts Any-shaped JSON dicts (JWT claims, Redis pipeline
# mappings) at the boundary of typed Python and stringly-typed protocols.
# The remaining strict checks (untyped defs, incomplete defs, no-any-return,
# warn-unused-ignores) keep type signatures honest where it matters.
[[tool.mypy.overrides]]
module = [
  "contexts.*.domain.*",
  "shared_kernel.*",
]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Relaxed zones — 3rd-party stubs.
[[tool.mypy.overrides]]
module = [
  "hvac.*",
  "arq.*",
  "google.re2.*",
  "minio.*",
  "neo4j.*",
  "qdrant_client.*",
  "prometheus_client.*",
  "opentelemetry.*",
  "jsonschema.*",
  "docx.*",
  "docker.*",
  "bleach.*",
  "re2.*",
  "aiosmtplib.*",
  "yaml.*",
  "pypdf.*",
  "weasyprint.*",
]
ignore_missing_imports = true

# Alembic migration files use a lot of dialect-specific helpers (JSONB, etc.)
# that don't have stubs; they're write-once and audit-only. Exclude them
# from typing entirely.
[[tool.mypy.overrides]]
module = ["alembic.versions.*"]
ignore_errors = true

# Tests don't need full type annotations — fixtures, monkeypatching, and
# `Any`-typed mocks are routine. We still typecheck the production code they
# import, but the test bodies themselves are not held to disallow_untyped_defs.
#
# The disabled error codes are the unavoidable consequence of substituting test
# doubles for real types: a `_FakeDB`/`SimpleNamespace` stood in for an
# `AsyncSession`/`Agent` (assignment, arg-type, list-item), `monkeypatch.setattr`
# rebinding a method or a module-level import (method-assign, attr-defined),
# narrowing a known union variant in an assertion (union-attr), or returning a
# fixture's `Any` (no-any-return). These protect nothing in shipped code — the
# production modules under test are still checked under their own module path —
# so suppressing them here is cheaper and more durable than ~60 unverified
# per-line `# type: ignore`s (warn_unused_ignores is off for tests anyway).
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_unused_ignores = false
check_untyped_defs = true
disable_error_code = [
  "assignment",
  "arg-type",
  "list-item",
  "method-assign",
  "attr-defined",
  "union-attr",
  "no-any-return",
  # SimpleNamespace/Mock fixtures stand in for real domain objects, so identity
  # and equality checks against them read as non-overlapping to mypy
  # (`comparison-overlap`); the same stubs plus state mutated through a fake's
  # method leave mypy over-narrowing a var it can no longer see change, flagging
  # the following real assertions as dead (`unreachable`). Both are test-fixture
  # artefacts, not shipped-code defects.
  "comparison-overlap",
  "unreachable",
]

# FastAPI middleware signatures pass `call_next` callbacks whose return type
# is `Awaitable[Response]` but resolves to `Any` in practice (downstream
# user-defined dispatch). Returning that response back is correct; the no-
# any-return warning isn't actionable here.
[[tool.mypy.overrides]]
module = ["app.api.middleware.*"]
disable_error_code = ["no-any-return"]

# FastAPI routers are introspected at runtime from signatures; type-arg
# additions don't change the runtime contract and add visual noise to dense
# request schemas.
[[tool.mypy.overrides]]
module = ["app.api.v1.*", "app.api.ws.*"]
disable_error_code = ["no-untyped-def", "type-arg"]

# Redis async client method signatures are typed as `Awaitable[T] | T` in
# the redis-py 5 stubs (the sync client shares the class). Awaiting the
# async result is correct at runtime; mypy can't narrow the union here
# (`misc`, `no-untyped-call`). The same redis-py 5.2 stub lag also affects
# these modules: bare `Redis` annotations want a type parameter (`type-arg`),
# `Redis`/`PubSub`/`ArqRedis.aclose()` exists at runtime but not in the stubs
# (`attr-defined`/`union-attr`), and `hset(mapping=dict[str, str])` is over-
# narrowed (`arg-type`). All runtime-correct; these codes are stub gaps, not
# real bugs. (A module may appear in only one overrides section, so the redis
# modules already listed here carry the full code set rather than being
# duplicated in the block below.)
[[tool.mypy.overrides]]
module = ["shared_kernel.auth.tokens", "shared_kernel.auth.ratelimit",
          "shared_kernel.realtime.*", "shared_kernel.infra.redis_buckets",
          "contexts.workflow.application.executors.wait_for_event",
          "contexts.workflow.application.executors.join",
          "contexts.orchestration.application.a2a_consumer",
          "contexts.orchestration.infrastructure.a2a_streams",
          "contexts.conversation.infrastructure.presence",
          "contexts.conversation.infrastructure.tus_store",
          "app.workers.tasks.workflow",
          "app.workers.tasks.workflow_common",
          "app.workers.tasks.workflow_steps",
          "app.workers.tasks.workflow_cron",
          "app.workers.tasks.workflow_signals",
          "app.workers.tasks.workflow_approvals",
          "app.workers.tasks.workflow_watchdog"]
disable_error_code = ["misc", "no-untyped-call", "type-arg", "attr-defined",
                      "union-attr", "arg-type"]

# SQLAlchemy 2.0 stub gap: `AsyncSession.execute()` is typed to return the base
# `Result`, but `.rowcount` only exists on the `CursorResult` subtype the engine
# actually returns at runtime for INSERT/UPDATE/DELETE. Reading `result.rowcount`
# is therefore correct at runtime but trips `attr-defined`, and the value it
# yields is `Any` so the surrounding `return` trips `no-any-return`. These two
# codes always travel together on the same line for this pattern. Disabling them
# per-module (rather than per-line) keeps the repositories readable; every
# attr-defined error in these modules was verified to be a `rowcount` access.
[[tool.mypy.overrides]]
module = [
  "contexts.workflow.infrastructure.repositories",
  "contexts.workflow.infrastructure.repositories.*",
  "contexts.orchestration.infrastructure.repositories",
  "contexts.orchestration.infrastructure.repositories.*",
  "contexts.keys.infrastructure.group_repository",
  "contexts.keys.infrastructure.carry_repository",
  "contexts.agents.infrastructure.mcp_repositories",
  "contexts.agents.infrastructure.repositories",
  "contexts.agents.infrastructure.repositories.*",
  "contexts.tenancy.infrastructure.repositories",
  "contexts.tenancy.infrastructure.repositories.*",
  "contexts.notification.infrastructure.repositories",
  "contexts.notification.infrastructure.repositories.*",
  "contexts.conversation.infrastructure.repositories",
  "contexts.conversation.infrastructure.repositories.*",
  "contexts.conversation.interfaces.facade",
  "contexts.skills.infrastructure.repositories",
  "contexts.knowledge.infrastructure.knowmap_repositories",
  "contexts.knowledge.infrastructure.graphrag_repositories",
  "contexts.identity.application.impersonation_service",
  "contexts.identity.application.admin_service",
  "app.workers.tasks.retention",
]
disable_error_code = ["attr-defined", "no-any-return"]

# More redis-py 5.2 stub gaps (same root cause as the block above, different
# modules — kept separate so this tighter set omits `misc`/`arg-type`, which
# none of these modules need):
#   - bare `Redis` annotations want a type parameter (`type-arg`); the library's
#     own examples and runtime use the unparameterised form.
#   - `Redis`/`PubSub`/`ArqRedis` expose `aclose()` at runtime (the modern alias
#     for `close()`), but it is missing from the stubs (`attr-defined` /
#     `union-attr`).
#   - `xack` is an untyped method in the stubs (`no-untyped-call`).
# Every attr-defined/union-attr error in these modules was verified to be an
# `aclose` access; nothing here masks a real typo.
[[tool.mypy.overrides]]
module = [
  "shared_kernel.infra.probes.redis",
  "shared_kernel.auth.clients",
  "shared_kernel.queue",
  "contexts.knowledge.infrastructure.redis_lock",
  "contexts.keys.infrastructure.revocation_listener",
  "contexts.orchestration.application.subagent_service",
  "contexts.workflow.application.run_engine",
  "contexts.agents.infrastructure.turn_lock",
  # app.workers.main's redis health probe uses the sync client, whose
  # `close()` is untyped in the redis-py 5.2 stubs (`no-untyped-call`).
  "app.workers.main",
]
disable_error_code = ["attr-defined", "type-arg", "union-attr", "no-untyped-call"]

# bleach/html5lib's `Filter` base class is typed `Any` in the stubs, so the
# reverse-tabnabbing `rel` filter that subclasses it trips `misc` ("Class cannot
# subclass Filter"). Runtime-correct; the subclass is exercised by the sanitize
# tests. Scoped to this one module so the rest of the strict shared_kernel zone
# keeps full `misc` checking.
#
# `attr-defined` rides along for the same class: newer types-bleach dropped
# `Filter` from the `bleach.html5lib_shim` stub even though bleach 6.4 re-exports
# it at runtime, so the import itself is flagged. That import is the module's
# only attr-defined error.
[[tool.mypy.overrides]]
module = ["shared_kernel.markdown.sanitize"]
disable_error_code = ["misc", "attr-defined"]

# redis-py's `Redis` is generic in the stubs but unparameterised in the library's
# own examples and at runtime; these modules annotate it bare (`type-arg`). Kept
# separate from the redis blocks above so only `type-arg` is relaxed here.
[[tool.mypy.overrides]]
module = [
  "contexts.prompt_studio.infrastructure.session_store",
  "contexts.prompt_studio.application.session_service",
]
disable_error_code = ["type-arg"]

# `Redis.eval` is untyped in the redis-py 5.2 stubs (`no-untyped-call`) — the same
# stub lag as the redis blocks above. The turn engine calls it for the two scripted
# coalesced-trigger operations. Deliberately its own block relaxing ONLY that code:
# this module is ~3300 lines and must keep full `attr-defined` / `union-attr`
# checking, unlike the small redis-facing modules listed earlier.
# The Redis calls themselves belong in `contexts.agents.infrastructure` (see the
# dossier's FU-5); when they move, this block moves with them.
[[tool.mypy.overrides]]
module = ["contexts.agents.application.runtime.turn_engine"]
disable_error_code = ["no-untyped-call"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pinned explicitly: pytest-asyncio 1.x warns when this is unset and intends to
# change the default. "function" is what 0.24 gave us, so this keeps behaviour.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast, isolated unit tests",
  "integration: requires infra (DB/Redis/Vault/etc.) — skipped in fmt/lint CI",
  "db: needs a provisioned datastore (real Postgres or Neo4j), not a fake — advisory locks, cascade deletes, Cypher visibility. Run by the backend-db CI job inside the compose network; excluded from backend-integration, which provisions no live infra",
  "e2e: full-stack tests; Playwright or compose.test.yml",
  "wiring: cross-context tripwires (K.7) — real Postgres+Redis+MailHog from compose.test.yml, FakeAdapter LLM; run by the backend-wiring CI job",
]

# ---------- Import-linter (SoC enforcement — §23 DDD boundaries) ----------
#
# Two contracts apply uniformly across all bounded contexts:
#
#   1. "Domain is framework-free" — the strongest DDD invariant. Domain
#      modules cannot import any framework / IO library. This is
#      automatically verified.
#   2. "Domain doesn't import within-context application/infrastructure" —
#      narrower than the original `layers` contract. Hexagonal architecture
#      legitimately has infrastructure import application.ports (port
#      protocols are defined in application, implemented in infrastructure).
#      We keep the asymmetric rule that makes domain pure but lets
#      infrastructure implement application ports.
#
# Contracts that previously enforced cross-context independence and
# router-to-facade-only access have been deferred. Re-establishing them
# requires a multi-context refactor (see docs/audit-2026-05-07.md, deferred
# follow-up T1–T3 for the planned cleanup):
#
#   - identity/tenancy/keys reach into notification.application directly
#     instead of going through notification.interfaces.facade.
#   - knowledge/agents/orchestration interleave for shared search/agent
#     state instead of via interfaces.
#   - several routers call .application services that transitively import
#     .infrastructure repositories (a port abstraction is missing on top of
#     the SQLAlchemy repos).
#
[tool.importlinter]
root_packages = ["app", "contexts", "shared_kernel"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure — cannot import its own application/infrastructure/interfaces"
type = "forbidden"
source_modules = [
  "contexts.identity.domain",
  "contexts.tenancy.domain",
  "contexts.keys.domain",
  "contexts.agents.domain",
  "contexts.knowledge.domain",
  "contexts.conversation.domain",
  "contexts.workflow.domain",
  "contexts.orchestration.domain",
  "contexts.audit.domain",
  "contexts.notification.domain",
  "contexts.skills.domain",
]
forbidden_modules = [
  "contexts.identity.application", "contexts.identity.infrastructure", "contexts.identity.interfaces",
  "contexts.tenancy.application", "contexts.tenancy.infrastructure", "contexts.tenancy.interfaces",
  "contexts.keys.application", "contexts.keys.infrastructure", "contexts.keys.interfaces",
  "contexts.agents.application", "contexts.agents.infrastructure", "contexts.agents.interfaces",
  "contexts.knowledge.application", "contexts.knowledge.infrastructure", "contexts.knowledge.interfaces",
  "contexts.conversation.application", "contexts.conversation.infrastructure", "contexts.conversation.interfaces",
  "contexts.workflow.application", "contexts.workflow.infrastructure", "contexts.workflow.interfaces",
  "contexts.orchestration.application", "contexts.orchestration.infrastructure", "contexts.orchestration.interfaces",
  "contexts.audit.application", "contexts.audit.infrastructure", "contexts.audit.interfaces",
  "contexts.notification.application", "contexts.notification.infrastructure", "contexts.notification.interfaces",
  "contexts.skills.application", "contexts.skills.infrastructure", "contexts.skills.interfaces",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free — no FastAPI / SQLAlchemy / HTTPX in domain"
type = "forbidden"
